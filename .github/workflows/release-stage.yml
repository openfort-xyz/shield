name: Build and push Docker image for stage

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    name: Build and push stage image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          service_account: ${{ secrets.GCP_SA }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          request_reason: "shield_image_push"
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Google Cloud Docker registry
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION_URL }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git commit timestamps
        id: time
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        id: build
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:stage-ts${{ env.epoch }}
            ghcr.io/${{ github.repository }}:latest
            ${{ secrets.GAR_IMAGE_URL }}:latest
            ${{ secrets.GAR_IMAGE_URL }}:stage-ts${{ env.epoch }}
          file: ./Dockerfile
          env: |
            SOURCE_DATE_EPOCH: "${{ env.epoch }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
